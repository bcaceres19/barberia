# Operaciones privadas de configuración de la barbería. HU-020 agrega la
# primera capacidad real: consultar y actualizar el nombre, la zona horaria
# IANA y el contacto opcional (correo, teléfono) de la barbería activa.
# HU-093 agrega la política pública de reserva y cancelación (anticipación,
# ventana, rejilla, plazo y cancelación tardía) como una operación propia
# bajo /private/settings/booking-policy, con su propia precondición de
# versión (If-Match): nunca comparte el schema ni el versionado de
# /private/settings/barbershop.
/private/settings/barbershop:
  get:
    tags: [Settings]
    summary: Consultar la configuración básica de la barbería activa
    description: >
      Lectura autenticada (HU-020, CA-020-01) de los cuatro campos
      autorizados de la barbería derivada de la sesión vigente: nombre,
      zona horaria IANA y contacto opcional (correo, teléfono).
      `barbershopId` nunca es un parámetro de esta operación -el tenant se
      deriva exclusivamente de `SessionCookie`- así que no existe un canal
      para pedir la configuración de otra barbería (`CA-020-05`).
    operationId: getBarbershopSettings
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-07, RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024]
    responses:
      "200":
        $ref: '../components/responses/BarbershopSettingsSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Settings]
    summary: Actualizar la configuración básica de la barbería activa
    description: >
      Actualización autenticada (HU-020, CA-020-02) de nombre, zona horaria
      IANA y contacto opcional. El cuerpo declara únicamente `name`,
      `timezone`, `contactEmail` y `contactPhone`; cualquier otro campo -en
      particular un identificador de barbería- se rechaza como forma
      inválida (`CA-020-05`). `contactEmail`/`contactPhone` vacíos
      significan "sin contacto": el servidor los normaliza a ausencia antes
      de guardar y nunca los registra en texto plano (`CA-020-06`). La zona
      se confirma contra el catálogo real de zonas IANA del servidor dentro
      de la misma operación que la escritura: una zona no reconocida
      responde `422` sin modificar ningún campo, ni siquiera los que sí
      eran válidos (`CA-020-03`). La respuesta exitosa devuelve la
      representación completa ya guardada, la misma forma que `GET`.
    operationId: updateBarbershopSettings
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-07, RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBarbershopSettingsRequest.yaml'
          examples:
            actualizacionCompleta:
              summary: Nombre, zona y contacto completo
              value:
                name: Barbería Ejemplo
                timezone: America/Bogota
                contactEmail: contacto@ejemplo.test
                contactPhone: "+573001234567"
            sinContacto:
              summary: Sin correo ni teléfono de contacto
              value:
                name: Barbería Ejemplo
                timezone: America/Bogota
                contactEmail: ""
                contactPhone: ""
    responses:
      "200":
        $ref: '../components/responses/BarbershopSettingsUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BarbershopSettingsValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/booking-policy:
  get:
    tags: [Settings]
    summary: Consultar la política pública de reserva y cancelación
    description: >
      Lectura autenticada (HU-093, CA-093-01) de anticipación mínima,
      ventana máxima, rejilla, plazo de cancelación y política de
      cancelación tardía de la barbería derivada de la sesión vigente. Una
      barbería nueva recibe exactamente los defaults de DEC-083 (60/3/15/20
      minutos-días, `lateCancellationClientAllowed`/
      `lateCancellationReasonRequired` en `true`). `barbershopId` nunca es
      un parámetro de esta operación -el tenant se deriva exclusivamente de
      `SessionCookie`- (CA-093-03).
    operationId: getBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-CAN-01, RN-CAN-02, RN-TEN-01]
    x-decisions: [DEC-005, DEC-006, DEC-010, DEC-018, DEC-024, DEC-083]
    responses:
      "200":
        $ref: '../components/responses/BookingPolicySuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  put:
    tags: [Settings]
    summary: Actualizar la política pública de reserva y cancelación
    description: >
      Reemplazo completo y autenticado (HU-093, CA-093-02) de los seis
      campos de la política pública, protegido por la precondición de
      versión `If-Match` (concurrencia optimista, mismo criterio que
      `HU-065`): si la representación vigente ya cambió, responde `409` con
      `code: version-conflict` en vez de aplicar un último escritor
      silencioso. Cada campo se valida contra el rango o conjunto discreto
      de `DEC-083`; `lateCancellationReasonRequired` no puede ser `true` si
      `lateCancellationClientAllowed` es `false` (combinación incoherente),
      y `minAdvanceMinutes` no puede alcanzar ni superar
      `maxAdvanceDays * 1440`. Un campo fuera de rango o una combinación
      incoherente responde `422` sin escribir nada, ni siquiera
      parcialmente (`CA-093-02`). Cambiar la política nunca reescribe citas,
      historial ni cancelaciones ya realizadas (`CA-093-04`). El cuerpo no
      declara `barbershopId`: el tenant se deriva exclusivamente de
      `SessionCookie` (`CA-093-03`).
    operationId: updateBookingPolicy
    security:
      - SessionCookie: []
    x-business-rules: [RN-DIS-04, RN-DIS-06, RN-CAN-01, RN-CAN-02, RN-TEN-01]
    x-decisions: [DEC-005, DEC-006, DEC-010, DEC-018, DEC-024, DEC-083]
    parameters:
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBookingPolicyRequest.yaml'
          examples:
            actualizacionCompleta:
              summary: Anticipación, ventana, rejilla y cancelación tardía personalizadas
              value:
                minAdvanceMinutes: 90
                maxAdvanceDays: 5
                slotGridMinutes: 30
                cancellationDeadlineMinutes: 60
                lateCancellationClientAllowed: false
                lateCancellationReasonRequired: false
    responses:
      "200":
        $ref: '../components/responses/BookingPolicyUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          El `If-Match` enviado ya no coincide con la representación
          vigente porque otra escritura tocó la barbería primero
          (`code: version-conflict`).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              versionDesactualizada:
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: la política de reserva cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/BookingPolicyValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/brand:
  get:
    tags: [Settings]
    summary: Consultar la marca y el vocabulario de la barbería activa
    description: >
      Lectura autenticada (issue #292, DEC-110) del color de acento y del
      vocabulario (palabra del negocio y del profesional, con plural y
      género gramatical) de la barbería derivada de la sesión vigente. Una
      barbería que nunca los cambió recibe los valores iniciales (`brass`,
      `barbería`, `barbero`) y el perfil `shop` (`DEC-115`), exactamente la
      interfaz anterior. Recurso
      propio, separado de `/private/settings/barbershop` para no ampliar el
      contrato cerrado de `HU-020` (`CA-020-07`). `barbershopId` nunca es un
      parámetro: el tenant se deriva exclusivamente de `SessionCookie`.
    operationId: getBrand
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024, DEC-110, DEC-115]
    responses:
      "200":
        $ref: '../components/responses/BrandSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Settings]
    summary: Actualizar la marca y el vocabulario de la barbería activa
    description: >
      Actualización autenticada (issue #292, DEC-110; perfil del panel,
      issue #294, DEC-115) de los seis campos de
      marca y vocabulario, que viajan siempre presentes; cualquier otro
      campo -en particular un identificador de barbería- se rechaza como
      forma inválida. `panelProfile` (`shop` o `solo`) es optativo: si se
      omite, el perfil guardado no cambia; fuera de la lista responde `422`.
      `accent` pertenece a una lista cerrada (nunca un color
      libre) y cada término se recorta, se colapsa y se pasa a minúsculas
      antes de validarlo y guardarlo. Un valor inválido responde `422` sin
      escribir nada. Son preferencias de presentación: no hay precondición de
      versión y la última escritura gana. Escribir toca `updated_at` de la
      fila, así que invalida el token `If-Match` de una política de reserva
      leída antes (`HU-093`), igual que una escritura de `HU-020`. La
      respuesta devuelve la representación canónica ya guardada, la misma
      forma que `GET`.
    operationId: updateBrand
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-024, DEC-110, DEC-115]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBrandRequest.yaml'
          examples:
            salonConEstilistas:
              summary: Salón de belleza con estilistas y acento esmeralda
              value:
                accent: emerald
                businessTerm: salón de belleza
                businessTermGender: masculine
                professionalTerm: estilista
                professionalTermPlural: estilistas
                professionalTermGender: feminine
            barberoIndividual:
              summary: Activar el panel de barbero individual
              value:
                accent: brass
                businessTerm: barbería
                businessTermGender: feminine
                professionalTerm: barbero
                professionalTermPlural: barberos
                professionalTermGender: masculine
                panelProfile: solo
            valoresIniciales:
              summary: Volver a los valores iniciales
              value:
                accent: brass
                businessTerm: barbería
                businessTermGender: feminine
                professionalTerm: barbero
                professionalTermPlural: barberos
                professionalTermGender: masculine
    responses:
      "200":
        $ref: '../components/responses/BrandUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BrandValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/settings/public-link:
  get:
    tags: [Settings]
    summary: Consultar el enlace público de reservas de la barbería activa
    description: >
      Lectura autenticada (issue #304, DEC-117) del identificador del enlace
      público de reservas de la barbería derivada de la sesión vigente, para
      que su dueño pueda verlo y copiarlo cuando lo necesite. Si la barbería
      todavía no tiene enlace, esta primera lectura lo genera
      (`<nombre><código aleatorio>` sin guiones, único globalmente) y lo conserva: las
      lecturas siguientes devuelven el mismo y renombrar la barbería no lo
      cambia. No hay operación para editarlo ni regenerarlo. `barbershopId`
      nunca es un parámetro: el tenant se deriva exclusivamente de
      `SessionCookie`, de modo que no existe forma de pedir el enlace de otra
      barbería. La respuesta no se almacena en caché.
    operationId: getPublicLink
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-082, DEC-117]
    responses:
      "200":
        $ref: '../components/responses/PublicLinkSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
