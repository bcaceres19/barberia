# Operaciones privadas de registro y listado de barberos (HU-021,
# F-CONF-02 parcial: solo registrar, listar, consultar y renombrar. No
# mezcla con servicios, horario ni agenda por barbero -esas capacidades
# tienen su propio archivo cuando existan (catalog.yaml, schedules.yaml)-
# ni con credenciales o roles de staff_user (DEC-047).
/private/barbers:
  get:
    tags: [Staff]
    summary: Listar los barberos de la barbería activa
    description: >
      Lista paginada por cursor (HU-021, CA-021-01, CA-021-02) de los
      barberos de la barbería derivada de la sesión vigente. Una barbería
      unipersonal y una de cuatro barberos usan exactamente la misma forma
      de respuesta: nunca una rama especial para "barbero único". Orden
      estable por fecha de alta y luego por identificador; sin paginación
      por offset porque la colección no tiene un máximo de negocio
      aprobado.
    operationId: listBarbers
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: cursor
        in: query
        required: false
        description: >
          Cursor opaco devuelto por una página anterior (`nextCursor`). Sin
          este parámetro, la respuesta empieza en la primera página.
        schema:
          type: string
        examples:
          continuacion:
            value: eyJjcmVhdGVkQXQiOiIyMDI2LTA4LTIzVDE1OjA1OjEwWiIsImlkIjoiMWEyYjNjNGQtNWU2Zi00NzA4LTlhMGItMWMyZDNlNGY1MDYxIn0=
      - name: limit
        in: query
        required: false
        description: Máximo de barberos por página.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        examples:
          porDefecto:
            value: 20
      - name: page
        in: query
        description: Modo numerado (DEC-107). No combinar con cursor/limit; fuera de rango se ajusta a la última página.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        description: Filas del modo numerado. No combinar con cursor/limit.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    responses:
      "200":
        $ref: '../components/responses/BarberListSuccess.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  post:
    tags: [Staff]
    summary: Registrar un barbero en la barbería activa
    description: >
      Alta de un barbero (HU-021, CA-021-02) protegida con clave de
      idempotencia (RN-IDE-01, DEC-043): repetir el mismo `POST` con la
      misma `Idempotency-Key` y el mismo cuerpo devuelve la misma
      representación creada sin crear una segunda fila. La misma clave con
      un `fullName` distinto responde `409` (conflicto de idempotencia); una
      clave nueva con el mismo `fullName` que un barbero existente SÍ crea
      un segundo barbero -esta historia no impone unicidad de nombre-. El
      tenant se deriva exclusivamente de `SessionCookie`; el cuerpo nunca
      acepta `barbershopId`.
    operationId: createBarber
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02, RN-IDE-01]
    x-decisions: [DEC-019, DEC-024, DEC-043, DEC-047]
    parameters:
      - $ref: '../components/parameters/IdempotencyKey.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateBarberRequest.yaml'
          examples:
            altaSimple:
              summary: Alta de un barbero
              value:
                fullName: Carlos Ramírez
    responses:
      "201":
        $ref: '../components/responses/BarberCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "409":
        description: >
          Conflicto de idempotencia (misma clave con otro contenido u otra
          operación, `IdempotencyConflictProblem`) u operación en curso con
          la misma clave (`IdempotencyLockedProblem`, DEC-043). Mismos dos
          problem types reutilizables que HU-004 ya documenta; ver esos
          componentes para la forma completa de cada uno.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, cuerpo distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              operacionEnCurso:
                summary: Otra transacción tiene el bloqueo de esta clave ahora mismo
                value:
                  type: /api/v1/problems/idempotency-locked
                  title: Operación en curso
                  status: 409
                  detail: la operación con esta clave de idempotencia todavía está en curso; reintenta en unos segundos
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-locked
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/BarberValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/barbers/{barberId}:
  get:
    tags: [Staff]
    summary: Consultar un barbero de la barbería activa
    description: >
      Lectura autenticada de un barbero por identificador (HU-021). Un
      identificador inexistente o perteneciente a otra barbería responde
      exactamente el mismo `404` (`CA-021-05`, `RN-TEN-01`): esta operación
      permite demostrar ese criterio de forma directa, sin depender solo del
      listado.
    operationId: getBarber
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del barbero.
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    responses:
      "200":
        $ref: '../components/responses/BarberSuccess.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  patch:
    tags: [Staff]
    summary: Renombrar un barbero de la barbería activa
    description: >
      Actualización parcial limitada al nombre (HU-021, CA-021-04). Rechaza
      objetos vacíos y cualquier campo distinto de `fullName` -en particular
      `active`, `deletedAt`, `sortOrder`, `staffUserId`, servicios u
      horarios, todos fuera de alcance (`DEC-047`, `CA-021-07`)-. Un
      identificador inexistente o de otra barbería responde el mismo `404`
      que `GET` (`CA-021-05`).
    operationId: renameBarber
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-019, DEC-024, DEC-047]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del barbero.
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UpdateBarberRequest.yaml'
          examples:
            renombrar:
              summary: Nuevo nombre
              value:
                fullName: Carlos A. Ramírez
    responses:
      "200":
        $ref: '../components/responses/BarberUpdated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BarberValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/barbers/{barberId}/photo:
  put:
    tags: [Staff]
    summary: Subir o reemplazar la fotografía de un barbero
    description: >
      Guarda la fotografía del barbero (DEC-104), el retrato que la lista del
      equipo y los selectores de barbero muestran en lugar del monograma. El
      cuerpo es la imagen binaria (`image/jpeg` o `image/png`), no JSON ni
      base64: el cliente la recorta a un cuadrado y la reduce a 512 px antes de
      enviarla, y el servidor la valida (formato real por sus bytes, no por el
      `Content-Type`; máximo 512 KiB; entre 64 y 1024 px por lado). Es un `PUT`:
      repetir la misma imagen deja el mismo estado y reemplazar una fotografía
      existente nunca crea una segunda, por eso no lleva `Idempotency-Key`.
      Responde el barbero completo con el nuevo `photoUpdatedAt`. Un
      identificador inexistente o de otra barbería responde el mismo `404`
      que `GET /private/barbers/{barberId}` (`CA-021-05`).
    operationId: putBarberPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del barbero.
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    requestBody:
      required: true
      description: >
        Imagen ya recortada y reducida por el cliente. Se descartan
        metadatos: el servidor solo conserva los bytes validados y su tipo.
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    responses:
      "200":
        $ref: '../components/responses/BarberPhotoUpdated.yaml'
      "400":
        $ref: '../components/responses/PayloadTooLargeProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "422":
        $ref: '../components/responses/BarberPhotoValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  get:
    tags: [Staff]
    summary: Leer la fotografía de un barbero
    description: >
      Sirve los bytes de la fotografía del barbero (DEC-104). Se usa como
      `src` de una imagen: la cookie de sesión viaja sola y el tenant se
      deriva de ella. Lleva `ETag` (derivado de `photoUpdatedAt`) y responde
      `304` a una solicitud condicional con `If-None-Match`; el cliente añade
      `photoUpdatedAt` como parámetro de consulta de la URL solo para
      invalidar su propia caché, el servidor lo ignora. Un barbero sin
      fotografía, inexistente o de otra barbería responde exactamente el mismo
      `404`: la lista ya dice cuáles tienen fotografía con `photoUpdatedAt`.
    operationId: getBarberPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del barbero.
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
      - name: If-None-Match
        in: header
        required: false
        description: Validador `ETag` de la copia que el cliente ya tiene.
        schema:
          type: string
    responses:
      "200":
        $ref: '../components/responses/BarberPhotoSuccess.yaml'
      "304":
        $ref: '../components/responses/BarberPhotoNotModified.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  delete:
    tags: [Staff]
    summary: Quitar la fotografía de un barbero
    description: >
      Borra la fotografía del barbero (DEC-104): la imagen se elimina, no se
      oculta, y el barbero vuelve a mostrarse con su monograma. Es idempotente:
      quitar una fotografía que no existe también responde `204`. No modifica
      el nombre ni ningún otro dato. Un identificador inexistente o de otra
      barbería responde el mismo `404` que el resto de operaciones del
      barbero (`CA-021-05`).
    operationId: deleteBarberPhoto
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01]
    x-decisions: [DEC-019, DEC-024, DEC-047, DEC-104]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del barbero.
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
    responses:
      "204":
        $ref: '../components/responses/BarberPhotoDeleted.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
