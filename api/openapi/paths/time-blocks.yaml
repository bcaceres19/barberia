# Operaciones privadas de bloqueos de agenda (HU-042): bloqueo puntual,
# definición recurrente (weekly/date_list), sus sub-recursos de fechas
# explícitas y excepciones, y la proyección efectiva de solo lectura. No
# mezcla con horario semanal (working-hours, HU-040) ni con excepciones de
# jornada/festivos (schedule-exceptions, HU-041) -esas capacidades tienen su
# propio archivo-. Crear un bloqueo o una serie NUNCA cancela, reprograma ni
# consulta citas: la lista de citas afectadas (RN-BLQ-03) la resuelve B3/B5.
/private/barbers/{barberId}/time-blocks:
  get:
    tags: [Schedule]
    summary: Listar los bloqueos puntuales de un barbero de la barbería activa
    description: >
      Lista paginada por cursor de los bloqueos puntuales del barbero de la
      ruta, ordenada por instante de inicio y luego por identificador.
      includeDeleted=true también trae los retirados lógicamente
      (RN-BLQ-04, auditoría). Un barberId inexistente o de otra barbería
      responde 404 (RN-TEN-01).
    operationId: listTimeBlocks
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-BLQ-01, RN-BLQ-04, RN-DIS-05, RN-DIS-07]
    x-decisions: [DEC-007, DEC-008, DEC-009, DEC-013, DEC-070]
    parameters:
      - name: barberId
        in: path
        required: true
        schema: { type: string, format: uuid }
        examples:
          barbero: { value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4 }
      - name: cursor
        in: query
        required: false
        schema: { type: string }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      - name: includeDeleted
        in: query
        required: false
        description: Incluye los bloqueos retirados lógicamente (auditoría, RN-BLQ-04). Por defecto false.
        schema: { type: boolean, default: false }
    responses:
      "200":
        $ref: '../components/responses/TimeBlockListSuccess.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
  post:
    tags: [Schedule]
    summary: Crear un bloqueo puntual para un barbero de la barbería activa
    description: >
      Alta de un bloqueo puntual, incluida la emergencia (RN-BLQ-01),
      protegida con clave de idempotencia (RN-IDE-01, DEC-043). Crear un
      bloqueo NUNCA falla por chocar con citas ya agendadas ni con otro
      bloqueo existente (RN-BLQ-03, DEC-008): la lista de citas afectadas
      la resuelve B3/B5, no esta operación. El tenant se deriva
      exclusivamente de SessionCookie y el barbero de barberId; el cuerpo
      nunca acepta barbershopId ni barberId. Un barberId inexistente o de
      otra barbería responde 404.
    operationId: createTimeBlock
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-BLQ-01, RN-BLQ-03, RN-DIS-05, RN-DIS-07, RN-IDE-01]
    x-decisions: [DEC-007, DEC-008, DEC-013, DEC-043, DEC-070]
    parameters:
      - name: barberId
        in: path
        required: true
        schema: { type: string, format: uuid }
        examples:
          barbero: { value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4 }
      - $ref: '../components/parameters/IdempotencyKey.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateTimeBlockRequest.yaml'
          examples:
            emergencia:
              summary: Bloqueo de emergencia, aunque haya citas en esa franja
              value:
                blockType: emergency
                startsAt: "2026-07-20T15:00:00-05:00"
                endsAt: "2026-07-20T19:00:00-05:00"
                reason: "Urgencia médica"
    responses:
      "201":
        $ref: '../components/responses/TimeBlockCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          Conflicto de idempotencia: misma clave con otro contenido
          (`IdempotencyConflictProblem`) u operación en curso con la misma
          clave (`IdempotencyLockedProblem`, DEC-043). Un bloqueo puntual
          nunca produce un 409 de negocio (RN-BLQ-03): siempre se crea.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              operacionEnCurso:
                value:
                  type: /api/v1/problems/idempotency-locked
                  title: Operación en curso
                  status: 409
                  detail: la operación con esta clave de idempotencia todavía está en curso; reintenta en unos segundos
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-locked
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/ValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/barbers/{barberId}/time-blocks/effective:
  get:
    tags: [Schedule]
    summary: Proyectar los bloqueos efectivos de un barbero en un rango de fechas
    description: >
      Operación interna de proyección/consulta (CA-042): expande las
      series activas dentro de [from, to] (fechas civiles, ambos límites
      inclusive) y lista los bloqueos puntuales vigentes que se solapan
      con ese rango, SIN materializar instancias de una serie en
      time_block. No es disponibilidad pública ni reserva (esas
      capacidades viven en B4); manualBlocks y seriesOccurrences vienen
      deliberadamente separados porque unirlos exige la zona IANA de la
      barbería, que ningún consumidor actual necesita.
    operationId: getEffectiveTimeBlocks
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-BLQ-01, RN-BLQ-04, RN-DIS-05, RN-DIS-07]
    x-decisions: [DEC-007, DEC-008, DEC-013, DEC-020, DEC-070]
    parameters:
      - name: barberId
        in: path
        required: true
        schema: { type: string, format: uuid }
        examples:
          barbero: { value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4 }
      - name: from
        in: query
        required: true
        description: Primera fecha civil del rango (inclusive).
        schema: { type: string, format: date }
        examples:
          desde: { value: "2027-03-01" }
      - name: to
        in: query
        required: true
        description: Última fecha civil del rango (inclusive). No puede ser anterior a from.
        schema: { type: string, format: date }
        examples:
          hasta: { value: "2027-03-31" }
    responses:
      "200":
        $ref: '../components/responses/EffectiveBlocksSuccess.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
