    tags: [Booking]
    summary: Corregir un resultado terminal (T8)
    description: >
      Corrige una clasificación terminal errónea hacia otro terminal
      distinto (HU-068, `T8` de `estados-citas.md`): `completed`, `no_show`,
      `cancelled_by_customer` o `cancelled_by_barber`. `confirmed` nunca es
      origen ni destino (CA-068-01/02) — corregir una cita que sigue
      `confirmed` responde `409 invalid-state`; enviar `confirmed` como
      destino responde `422 validation-error`. El estado y un único evento
      `appointment_status_corrected` (con estado anterior, nuevo y el motivo
      obligatorio) se escriben en la misma transacción tenant-aware
      (CA-068-01/03); los eventos anteriores permanecen intactos, sin editar
      ni borrar nada. Repetir la corrección hacia el MISMO estado vigente es
      un `200` no-op exitoso, sin duplicar el evento (CA-068-02). Al
      corregir desde un cancelado hacia `completed`/`no_show`, se revalida
      la misma frontera temporal que T4/T7 (`422` si `startsAt` todavía no
      pasó) y la misma restricción de exclusión de PostgreSQL que protege
      reprogramar: un cruce con otra cita del mismo barbero responde
      `409 conflict` sin escribir nada (CA-068-04). Al corregir desde
      `completed`/`no_show` hacia un cancelado, la cita deja de ocupar
      agenda en la misma confirmación (CA-068-05). Protegida con clave de
      idempotencia (RN-IDE-01, DEC-043) y con la precondición `If-Match` (el
      `versionToken` de una lectura anterior del detalle, HU-064). El tenant
      y el actor se derivan exclusivamente de `SessionCookie`; el cuerpo
