# Operaciones privadas de agenda del barbero: crear, modificar, reprogramar,
# cancelar y cambiar estado de turnos, con historial. Requiere sesión
# autenticada. Ver docs/06-api/estandar-openapi.md.
#
# HU-061 (B3) agrega la creación manual; HU-064 agrega detalle e historial de
# solo lectura; HU-065 agrega T2 (reprogramación auditada). Editar (T3),
# cancelar y cambiar estado quedan sin contenido todavía.
/private/appointments:
  post:
    tags: [Booking]
    summary: Registrar un turno manual
    description: >
      Alta de una cita `confirmed` a partir de un turno recibido por
      teléfono, WhatsApp o en persona (HU-061, CA-061-01 a CA-061-08),
      protegida con clave de idempotencia (RN-IDE-01, DEC-043): repetir el
      mismo `POST` con la misma `Idempotency-Key` y el mismo cuerpo
      devuelve la misma representación creada sin crear una segunda cita.
      No está sujeta a la anticipación mínima ni a la ventana máxima de la
      reserva pública (RN-DIS-04, DEC-005/DEC-018): admite un instante que
      ya empezó o uno más allá de la ventana pública. El servicio elegido
      debe estar activo y asignado al barbero elegido (DEC-072); un
      intervalo que se solapa con otra cita del mismo barbero (RN-CON-01)
      o con un bloqueo vigente (DEC-073) responde `409`. El cliente se
      reconcilia por teléfono o, si falta, por correo (DEC-045, DEC-046,
      DEC-071); sin ninguno de los dos, siempre se crea un cliente nuevo,
      nunca por nombre. El tenant y el actor se derivan exclusivamente de
      `SessionCookie`; el cuerpo nunca acepta `barbershopId`, `customerId`,
      `status`, `origin` ni ningún dato de servicio.
    operationId: createManualAppointment
    security:
      - SessionCookie: []
    x-business-rules:
      [RN-TEN-01, RN-CIT-02, RN-RES-01, RN-RES-02, RN-RES-03, RN-CON-01,
       RN-CON-03, RN-DIS-04, RN-DIS-05, RN-DIS-07, RN-HIS-01, RN-IDE-01]
    x-decisions:
      [DEC-004, DEC-005, DEC-007, DEC-016, DEC-018, DEC-020, DEC-043,
       DEC-045, DEC-046, DEC-071, DEC-072, DEC-073]
    parameters:
      - $ref: '../components/parameters/IdempotencyKey.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateManualAppointmentRequest.yaml'
          examples:
            turnoManual:
              summary: Turno manual con teléfono
              value:
                barberId: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
                serviceId: 6f1a2b3c-4d5e-4f60-8172-8394a5b6c7d8
                attendeeName: Carlos Restrepo
                customerFullName: Carlos Restrepo
                customerPhone: "+573001234567"
                startsAt: "2026-09-03T14:30:00"
    responses:
      "201":
        $ref: '../components/responses/AppointmentCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        description: >
          `barberId` inexistente o de otra barbería, o `serviceId`
          inexistente, inactivo o no asignado a `barberId` (DEC-072). Un
          único `code` sin distinguir la causa (RN-TEN-01).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              servicioNoAsignado:
                value:
                  type: /api/v1/problems/not-found
                  title: No encontrado
                  status: 404
                  detail: no existe un servicio activo asignado a ese barbero
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: not-found
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "409":
        description: >
          Conflicto de idempotencia (misma clave con otro contenido u otra
          operación, `IdempotencyConflictProblem`), operación en curso con
          la misma clave (`IdempotencyLockedProblem`, DEC-043), cruce con
          otra cita del mismo barbero (RN-CON-01) o bloqueo vigente en ese
          intervalo (DEC-073, mismo tratamiento que un cruce). Los problem
          types comparten status pero tienen `code` distinto: el cliente
          decide por `code`, nunca por `detail`.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, cuerpo distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              operacionEnCurso:
                summary: Otra transacción tiene el bloqueo de esta clave ahora mismo
                value:
                  type: /api/v1/problems/idempotency-locked
                  title: Operación en curso
                  status: 409
                  detail: la operación con esta clave de idempotencia todavía está en curso; reintenta en unos segundos
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-locked
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              cruceDeAgenda:
                summary: El barbero ya tiene una cita en ese intervalo
                value:
                  type: /api/v1/problems/conflict
                  title: Conflicto
                  status: 409
                  detail: el barbero ya tiene una cita en ese intervalo
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              bloqueoVigente:
                summary: El intervalo se solapa con un bloqueo vigente del barbero (DEC-073)
                value:
                  type: /api/v1/problems/conflict
                  title: Conflicto
                  status: 409
                  detail: el barbero tiene un bloqueo vigente en ese intervalo
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/AppointmentValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/private/barbers/{barberId}/appointments/daily-agenda:
  get:
    tags: [Booking]
    summary: Consultar la agenda diaria de un barbero
    description: >
      Lista cronológica, cerrada y sin cursor (HU-062, CA-062-01 a
      CA-062-07) de los turnos del barbero de la ruta cuyo intervalo
      interseca el rango civil de `date` en la zona IANA de la barbería:
      un turno que cruza medianoche aparece en cada agenda diaria cuyo
      rango interseca su intervalo (DEC-075), no solo en el día en que
      empieza. Sin `date`, la respuesta usa "hoy" en esa misma zona
      (CA-062-01). La ruta exige un `barberId` explícito: no existe una
      vista consolidada de varios barberos (DEC-074, DEC-047). La
      respuesta nunca expone teléfono, correo, nota ni `customerId`
      (CA-062-05); el snapshot de servicio ya congelado en la cita es la
      única fuente visible (DEC-004), sin unir contra el catálogo vigente.
    operationId: listDailyAgenda
    security:
      - SessionCookie: []
    x-business-rules: [RN-TEN-01, RN-CIT-01, RN-RES-02, RN-RES-03, RN-DIS-07]
    x-decisions:
      [DEC-007, DEC-016, DEC-019, DEC-020, DEC-024, DEC-047, DEC-074, DEC-075]
    parameters:
      - name: barberId
        in: path
        required: true
        description: Identificador del único barbero cuya agenda se consulta (DEC-074).
        schema:
          type: string
          format: uuid
        examples:
          barbero:
            value: 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
      - name: date
        in: query
        required: false
        description: >
          Fecha civil `AAAA-MM-DD` en la zona de la barbería. Sin este
          parámetro, la respuesta usa "hoy" en esa zona (CA-062-01).
        schema:
          type: string
          format: date
        examples:
          hoy:
            value: "2026-08-28"
    responses:
      "200":
        description: >
          Turnos del barbero cuyo intervalo interseca el día pedido,
          ordenados por `startsAt` y luego por `id` (orden estable).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/DailyAgendaResponse.yaml'
            examples:
              conTurnos:
                summary: Dos turnos, uno de ellos nocturno
                value:
                  items:
                    - id: 3f4a5b6c-7d8e-49f0-a1b2-c3d4e5f60718
                      attendeeName: Carlos Restrepo
                      startsAt: "2026-08-28T14:30:00Z"
                      endsAt: "2026-08-28T15:00:00Z"
                      status: confirmed
                      origin: manual
                      serviceName: Corte clásico
                      durationMinutes: 30
                      priceAmount: "20000.00"
                      currency: COP
                    - id: 6f1a2b3c-4d5e-4f60-8172-8394a5b6c7d8
                      attendeeName: Ana Gómez
                      startsAt: "2026-08-28T23:30:00Z"
                      endsAt: "2026-08-29T00:15:00Z"
                      status: confirmed
                      origin: public
                      serviceName: Barba y corte
                      durationMinutes: 45
                      priceAmount: "35000.00"
                      currency: COP
              sinTurnos:
                summary: Barbero sin ningún turno ese día
                value:
                  items: []
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        description: >
          `barberId` con forma inválida, inexistente o de otra barbería
          (RN-TEN-01), sin distinguir la causa.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              barberoAjeno:
                value:
                  type: /api/v1/problems/not-found
                  title: No encontrado
                  status: 404
                  detail: no existe un barbero con ese identificador
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: not-found
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

