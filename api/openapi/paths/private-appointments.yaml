/private/appointments/{appointmentId}/reschedule:
  post:
    tags: [Booking]
    summary: Reprogramar un turno (T2)
    description: >
      Mueve el intervalo de una cita `confirmed` a un nuevo inicio futuro
      (HU-065, `T2` de `estados-citas.md`), sin cambiar ningún otro dato:
      barbero, servicio, duración, precio, cliente, persona, origen, nota y
      estado permanecen iguales. El fin se deriva de
      `durationMinutesSnapshot`, nunca del cliente. Protegida con clave de
      idempotencia (RN-IDE-01, DEC-043) y con la precondición `If-Match`
      (el `versionToken` de una lectura anterior del detalle, HU-064): si la
      representación vigente ya cambió, responde `409` con
      `code: version-conflict` en vez de aplicar un último escritor
      silencioso. Un intervalo idéntico al vigente es un no-op exitoso: no
      genera una entrada de historial nueva. Un bloqueo vigente del barbero
      en el nuevo intervalo rechaza la operación con el mismo `409` que un
      cruce con otra cita (`DEC-076`). El tenant y el actor se derivan
      exclusivamente de `SessionCookie`.
    operationId: rescheduleAppointment
    security:
      - SessionCookie: []
    x-business-rules:
      [RN-CIT-01, RN-CIT-03, RN-CON-01, RN-CON-03, RN-DIS-05, RN-DIS-07,
       RN-HIS-01, RN-HIS-02, RN-TEN-01, RN-IDE-01]
    x-decisions:
      [DEC-002, DEC-004, DEC-007, DEC-014, DEC-016, DEC-020, DEC-024,
       DEC-043, DEC-074, DEC-075, DEC-076]
    parameters:
      - name: appointmentId
        in: path
        required: true
        description: Identificador de la cita.
        schema:
          type: string
          format: uuid
        examples:
          cita:
            value: 3f4a5b6c-7d8e-49f0-a1b2-c3d4e5f60718
      - $ref: '../components/parameters/IdempotencyKey.yaml'
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/RescheduleAppointmentRequest.yaml'
          examples:
            nuevoInicio:
              summary: Mover el turno a un nuevo inicio
              value:
                startsAt: "2026-09-10T14:30:00"
    responses:
      "200":
        $ref: '../components/responses/AppointmentRescheduled.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "401":
        $ref: '../components/responses/UnauthorizedProblem.yaml'
      "404":
        description: >
          `appointmentId` con forma inválida, inexistente o de otra
          barbería (RN-TEN-01), sin distinguir la causa.
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              citaAjena:
                value:
                  type: /api/v1/problems/not-found
                  title: No encontrado
                  status: 404
                  detail: no existe una cita con ese identificador
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: not-found
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "409":
        description: >
          Cuatro conflictos distinguibles por `code`, nunca por `detail`:
          conflicto de idempotencia (misma clave con otro contenido u otra
          operación, `IdempotencyConflictProblem`) u operación en curso con
          la misma clave (`IdempotencyLockedProblem`, DEC-043); conflicto de
          agenda (`code: conflict`, cruce con otra cita o bloqueo vigente,
          `DEC-076`); conflicto de versión (`code: version-conflict`, el
          `If-Match` enviado ya no coincide con la representación vigente);
          o estado inválido (`code: invalid-state`, la cita ya no está
          `confirmed`).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, cuerpo distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              operacionEnCurso:
                summary: Otra transacción tiene el bloqueo de esta clave ahora mismo
                value:
                  type: /api/v1/problems/idempotency-locked
                  title: Operación en curso
                  status: 409
                  detail: la operación con esta clave de idempotencia todavía está en curso; reintenta en unos segundos
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-locked
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              cruceDeAgenda:
                summary: El barbero ya tiene una cita en el nuevo intervalo, o un bloqueo vigente (DEC-076)
                value:
                  type: /api/v1/problems/conflict
                  title: Conflicto
                  status: 409
                  detail: el barbero tiene un bloqueo vigente en ese intervalo
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              versionDesactualizada:
                summary: El If-Match enviado ya no coincide con la representación vigente
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: el turno cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              estadoInvalido:
                summary: La cita ya no está confirmed (otra transición ya la resolvió)
                value:
                  type: /api/v1/problems/invalid-state
                  title: Estado inválido
                  status: 409
                  detail: el turno ya no está confirmado; recarga para ver su estado actual
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: invalid-state
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/RescheduleValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
/private/appointments/{appointmentId}/cancel:
  post:
    tags: [Booking]
    summary: Cancelar un turno por el barbero (T6)
    description: >
      Cancela una cita `confirmed` (HU-066, `T6` de `estados-citas.md`) en
      cualquier momento antes, durante o después de su intervalo: ningún
      reloj del cliente ni ventana de tiempo lo restringe (CA-066-02).
      Cambia el estado a `cancelled_by_barber` e inserta un único evento
      `appointment_cancelled_by_barber` dentro de la misma transacción que
      la actualización de estado. La cita deja de participar en la
      restricción de exclusión de inmediato, liberando su franja si es
      futura (CA-066-03). Protegida con clave de idempotencia (RN-IDE-01,
      DEC-043) y con la precondición `If-Match` (el `versionToken` de una
      lectura anterior del detalle, HU-064). Repetir la cancelación sobre
      una cita ya `cancelled_by_barber` es un no-op exitoso, sin duplicar
