# Operaciones de acceso del cliente mediante el token del enlace de su cita
# (consultar y cancelar). Ver docs/06-api/estandar-openapi.md. HU-098 agrega
# la primera: GET /customer/appointments/{token}, lectura mínima autenticada
# únicamente por la credencial del enlace, sin sesión. La cancelación
# (HU-099, T5) vive en este mismo archivo: POST .../cancel.
# security: [] en cada operación, según docs/06-api/estandar-openapi.md: la
# audiencia customer no usa el esquema de sesión del barbero, la credencial
# viaja en la ruta, no en una cabecera de autorización.
/customer/appointments/{token}:
  get:
    tags: [CustomerAccess]
    summary: Consultar el turno del cliente mediante la credencial de su enlace
    description: >
      Resuelve `token` -la credencial aleatoria larga que HU-097 emitió una
      sola vez dentro de la transacción de confirmación y envió por correo
      (DEC-089)- al turno correspondiente, sin sesión (HU-098, CA-098-01).
      El servidor nunca recibe ni compara el valor en claro directamente
      contra la base de datos: lo hashea con SHA-256 antes de resolver el
      tenant mediante `public_resolve_appointment_token_tenant`, la función
      `SECURITY DEFINER` estrecha que agrega la migración
      `20260916120000_add_public_resolve_appointment_token_tenant.sql`
      (mismo patrón exacto que `public_resolve_barbershop_by_slug`, HU-090).
      Un `token` con forma inválida, inexistente, vencido o ya revocado
      (al anonimizarse la cita, RN-DAT-03) produce
      EXACTAMENTE la misma respuesta `404` uniforme (CA-098-02, RN-TEN-01):
      esta operación nunca distingue la causa. Cancelar NO revoca el enlace
      (`DEC-136`): un turno cancelado responde `200` con su `status`
      cancelado, sin acciones disponibles. La respuesta trae solo los
      datos mínimos ya autorizados por HU-098 (barbería, persona atendida,
      servicio, barbero, intervalo/zona, estado y política vigente de
      cancelación); nunca un identificador interno, contacto del cliente,
      nota, historial ni ningún otro turno (CA-098-03). `status` nunca
      implica que la falta de respuesta del cliente vaya a cancelar el
      turno (RN-CNF-02, CA-098-04).
    operationId: getCustomerAppointment
    security: []
    x-business-rules: [RN-CNF-01, RN-CNF-02, RN-DAT-01, RN-DAT-02, RN-DAT-03, RN-TEN-01]
    x-decisions: [DEC-016, DEC-022, DEC-024, DEC-025, DEC-049, DEC-077, DEC-078, DEC-079, DEC-089, DEC-091, DEC-110, DEC-119]
    parameters:
      - name: token
        in: path
        required: true
        description: >
          Credencial en claro del enlace de acceso al turno (DEC-089). No es
          un identificador interno: el servidor solo la usa para calcular su
          hash y resolver el tenant; nunca se registra ni persiste en claro
          (CA-098-02).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
    responses:
      "200":
        $ref: '../components/responses/CustomerAppointmentSuccess.yaml'
      "404":
        description: >
          `token` con forma inválida, inexistente, vencido o revocado, sin
          distinguir la causa (CA-098-02, RN-TEN-01).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              enlaceNoAccesible:
                value:
                  type: /api/v1/problems/not-found
                  title: No encontrado
                  status: 404
                  detail: no existe un turno accesible con ese enlace
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: not-found
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/review:
  post:
    tags: [CustomerAccess]
    summary: Calificar al barbero de un turno completado
    description: >
      El cliente deja una calificación de 1 a 5 y un comentario opcional sobre
      el barbero que lo atendió (HU-100, `DEC-128`), con la misma credencial del
      enlace de su turno y sin sesión. Solo un turno `completed` sin reseña
      admite una: un turno no completado, cancelado o ya calificado responde
      siempre el mismo `409`, sin distinguir la causa (`CA-100-01`); un `token`
      inexistente, vencido o revocado responde el mismo `404` uniforme que
      `GET`. Como máximo una reseña por turno (`CA-100-03`): repetir la llamada
      no crea otra fila ni modifica la existente, así que no necesita
      `Idempotency-Key`. La reseña queda visible de inmediato en la selección
      pública del barbero y cuenta en su promedio.
    operationId: createCustomerAppointmentReview
    security: []
    x-business-rules: [RN-TEN-01, RN-DAT-02]
    x-decisions: [DEC-089, DEC-104, DEC-128]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateReviewRequest.yaml'
          examples:
            conComentario:
              value:
                rating: 5
                comment: Muy buen corte y puntual.
            soloEstrellas:
              value:
                rating: 4
    responses:
      "201":
        $ref: '../components/responses/ReviewCreated.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        $ref: '../components/responses/ReviewNotAvailableProblem.yaml'
      "422":
        $ref: '../components/responses/ValidationProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'

/customer/appointments/{token}/cancel:
  post:
    tags: [CustomerAccess]
    summary: Cancelar el turno por el cliente (T5)
    description: >
      El cliente cancela su turno `confirmed` con la credencial del enlace y
      sin sesión (`HU-099`, `T5` de `estados-citas.md`). Solo procede si la
      política VIGENTE de la barbería lo autoriza, evaluada con el reloj del
      servidor y nunca con uno enviado por el cliente (`RN-CAN-01`,
      `RN-CAN-02`): hasta `startsAt - cancellationDeadlineMinutes` inclusive es
      dentro de plazo; después y antes de `startsAt` solo procede con
      `lateCancellationClientAllowed` y, si `lateCancellationReasonRequired`,
      con un `reason` no vacío; con el turno ya iniciado nunca procede. Un plazo
      de 0 minutos trata toda cancelación como tardía (`DEC-083`). Protegida con
      `Idempotency-Key` (`RN-IDE-01`, `DEC-043`) y con la precondición `If-Match`
      (el `versionToken` de `GET`): una repetición exacta reproduce la respuesta
      sin duplicar el historial. En una sola transacción el turno pasa a
      `cancelled_by_customer`, se registra el motivo y un único evento con actor
      cliente. El enlace NO se revoca (`DEC-136`): `GET` sigue mostrando el
      turno cancelado y repetir la misma llamada (misma `Idempotency-Key`)
      reproduce la respuesta original. La franja vuelve de inmediato a la
      disponibilidad pública (`HU-094`). Un `token` inexistente, vencido o
      revocado responde el mismo `404` uniforme que `GET`, sin revelar la
      causa. Notificar al barbero queda para B5.
    operationId: cancelCustomerAppointment
    security: []
    x-business-rules: [RN-CAN-01, RN-CAN-02, RN-CIT-03, RN-HIS-01, RN-HIS-02, RN-IDE-01, RN-TEN-01]
    x-decisions: [DEC-010, DEC-016, DEC-024, DEC-041, DEC-043, DEC-083, DEC-089]
    parameters:
      - name: token
        in: path
        required: true
        description: Credencial en claro del enlace de acceso al turno (DEC-089).
        schema:
          type: string
          maxLength: 256
        examples:
          token:
            value: 3n9F1sQe2z8mM5wYtR7pL0oXhC4bV6dK1aE9jU2gN8i
      - $ref: '../components/parameters/IdempotencyKey.yaml'
      - $ref: '../components/parameters/IfMatch.yaml'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CancelCustomerAppointmentRequest.yaml'
          examples:
            conMotivo:
              value:
                reason: Me surgió un imprevisto de trabajo.
            sinCuerpo:
              summary: Dentro de plazo el cuerpo puede omitirse
              value: {}
    responses:
      "200":
        $ref: '../components/responses/CustomerAppointmentCancelled.yaml'
      "400":
        $ref: '../components/responses/InvalidRequestProblem.yaml'
      "404":
        $ref: '../components/responses/NotFoundProblem.yaml'
      "409":
        description: >
          Tres conflictos distinguibles por `code`, nunca por `detail`:
          conflicto de idempotencia (misma clave con otro contenido u otra
          operación) u operación en curso con la misma clave; conflicto de
          versión (`code: version-conflict`, el `If-Match` ya no coincide: el
          turno cambió desde que se leyó); o estado inválido
          (`code: invalid-state`, el turno ya no está `confirmed`, p. ej. ya lo
          resolvió el barbero).
        headers:
          X-Request-Id:
            $ref: '../components/headers/XRequestId.yaml'
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas/Problem.yaml'
            examples:
              contenidoDistinto:
                summary: Misma clave, contenido distinto
                value:
                  type: /api/v1/problems/idempotency-conflict
                  title: Conflicto de idempotencia
                  status: 409
                  detail: la clave de idempotencia ya se usó con un contenido distinto; usa una clave nueva
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: idempotency-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              versionDesactualizada:
                value:
                  type: /api/v1/problems/version-conflict
                  title: Conflicto de versión
                  status: 409
                  detail: el turno cambió desde que se leyó; recarga antes de reintentar
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: version-conflict
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
              estadoInvalido:
                value:
                  type: /api/v1/problems/invalid-state
                  title: Estado inválido
                  status: 409
                  detail: el turno ya no está confirmado; recarga para ver su estado actual
                  instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
                  code: invalid-state
                  requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      "422":
        $ref: '../components/responses/CancellationRejectedProblem.yaml'
      "500":
        $ref: '../components/responses/InternalErrorProblem.yaml'
