# Respuesta 202 de POST /auth/challenge (HU-007, DEC-062). Siempre la misma
# forma, exista o no la cuenta, esté o no el teléfono verificado y esté o no
# la IP realmente escalada: la solicitud queda "aceptada para procesar", sin
# confirmar ningún hecho sobre la cuenta (no enumeración).
description: >
  La solicitud fue recibida. Si la cuenta existe, tiene el teléfono
  verificado y la IP solicitante está en verificación, se envía un código
  por WhatsApp oficial; en cualquier otro caso no ocurre ningún envío, sin
  que la respuesta lo revele.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/ChallengeAcceptedResponse.yaml'
    examples:
      solicitudRecibida:
        summary: Confirmación genérica
        value:
          message: Si la cuenta existe y su teléfono está verificado, recibirá un código por WhatsApp.
