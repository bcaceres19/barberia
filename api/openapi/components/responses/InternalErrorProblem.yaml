    $ref: '../headers/XRequestId.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      errorInterno:
        summary: Fallo inesperado
        value:
          type: /api/v1/problems/internal-error
          title: Error interno
          status: 500
