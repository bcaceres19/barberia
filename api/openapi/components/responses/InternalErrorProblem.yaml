# CA-003-02: el cuerpo nunca incluye SQL, rutas de archivo, nombres de
# proveedor, versiones de dependencias ni trazas. detail se omite a
# propósito en el ejemplo: la implementación real tampoco lo rellena para
# este tipo de problema.
