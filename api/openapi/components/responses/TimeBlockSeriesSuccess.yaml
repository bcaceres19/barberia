# Respuesta 200 de
# GET /private/barbers/{barberId}/time-block-series/{seriesId}.
description: Serie recurrente del barbero de la ruta, con sus fechas/excepciones.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/TimeBlockSeriesResponse.yaml'
    examples:
      semanal:
        value:
          id: 7a1b2c3d-4e5f-4061-8273-8495a6b7c8d9
          blockType: lunch
          recurrenceKind: weekly
          isoWeekday: 1
          startsTime: "13:00"
          durationMinutes: 60
          effectiveFrom: "2026-01-04"
          effectiveUntil: null
          reason: null
          deletedAt: null
          createdAt: "2026-08-26T15:04:05Z"
          updatedAt: "2026-08-26T15:04:05Z"
          dates: []
          exceptions:
            - excludedDate: "2027-01-08"
              reason: "El barbero libró ese día"
              createdAt: "2026-08-26T15:04:05Z"
