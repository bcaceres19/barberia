# 422 de POST /customer/appointments/{token}/cancel (HU-099): la política
# vigente o el cuerpo rechazan la cancelación. No se persistió nada ni se
# consumió la clave de idempotencia.
description: >
  Tres rechazos distinguibles por `code`, nunca por `detail`:
  `cancellation-window-closed` (el plazo venció y la política no permite
  cancelar fuera de plazo, o el turno ya empezó: el cliente debe contactar a
  la barbería, `barbershopContactEmail`/`barbershopContactPhone`),
  `cancellation-reason-required` (la cancelación fuera de plazo exige un
  motivo y no llegó o llegó en blanco) y `validation-error` (el motivo excede
  500 caracteres).
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      plazoVencido:
        summary: Fuera de plazo y la barbería no permite cancelar tarde
        value:
          type: /api/v1/problems/cancellation-window-closed
          title: Plazo de cancelación vencido
          status: 422
          detail: el plazo para cancelar por tu cuenta ya venció; contacta a la barbería
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: cancellation-window-closed
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      motivoObligatorio:
        summary: Fuera de plazo, permitido, pero con motivo obligatorio
        value:
          type: /api/v1/problems/cancellation-reason-required
          title: Motivo de cancelación obligatorio
          status: 422
          detail: cuenta brevemente el motivo de la cancelación
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: cancellation-reason-required
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
      motivoDemasiadoLargo:
        value:
          type: /api/v1/problems/validation-error
          title: Error de validación
          status: 422
          detail: el motivo excede el largo máximo
          instance: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
          code: validation-error
          requestId: 8f3ac2b1e4d5f6a7c8d9e0f1a2b3c4d5
