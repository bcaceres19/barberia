# Respuesta 200 de GET /private/services/{serviceId}/deactivation-impact
# (HU-024, CA-024-01).
description: >
  Impacto real de desactivar el servicio, calculado en el momento de esta
  solicitud.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
content:
  application/json:
    schema:
      $ref: '../schemas/ServiceDeactivationImpactResponse.yaml'
    examples:
      sinCitas:
        summary: El servicio no tiene citas futuras confirmadas
        value:
          affectedAppointments: 0
      conCitas:
        summary: El servicio tiene tres citas futuras confirmadas (RN-SER-03)
        value:
          affectedAppointments: 3
