# Respuesta 204 de POST /auth/recovery/reset-password (HU-008, DEC-064).
# Sin cuerpo. La contraseña ya quedó actualizada y todas las sesiones
# activas del usuario, revocadas, en la misma operación atómica
# (CA-008-05).
description: >
  Contraseña actualizada. Todas las sesiones activas del usuario quedaron
  revocadas; debe iniciar sesión de nuevo con la contraseña nueva.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
