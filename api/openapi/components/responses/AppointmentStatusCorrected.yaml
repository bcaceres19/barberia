# Respuesta 200 de POST /private/appointments/{appointmentId}/correct-status
# (HU-068, T8). 200, no 204: el barbero puede repetir la corrección hacia el
# mismo destino (CA-068-02) y espera la misma representación completa que
# otras operaciones de escritura sobre el turno.
