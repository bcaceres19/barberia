# Respuesta 200 de POST /private/appointments/{appointmentId}/reschedule
# (HU-065). 200, no 201: T2 mueve una cita ya existente, no crea un recurso
# nuevo.
description: >
  El turno se reprogramó (o, si el nuevo inicio coincide exactamente con el
  vigente, la operación fue un no-op exitoso sin nueva entrada de
  historial).
