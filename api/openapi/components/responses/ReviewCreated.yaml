# Respuesta 201 de POST /customer/appointments/{token}/review (HU-100).
description: Reseña guardada; ya cuenta en el promedio público del barbero.
headers:
  X-Request-Id:
    $ref: '../headers/XRequestId.yaml'
  Cache-Control:
    description: Siempre `no-store` (RN-DAT-02).
    schema:
      type: string
      enum: [no-store]
content:
  application/json:
    schema:
      $ref: '../schemas/CustomerReview.yaml'
    examples:
      reseñaGuardada:
        value:
          rating: 5
          comment: Muy buen corte y puntual.
          createdAt: "2027-03-15T16:10:00Z"
