# Cuerpo de PATCH /private/integrations/google-calendar (issue #323, DEC-101).
type: object
additionalProperties: false
description: >
  Anticipación del recordatorio de los eventos del barbero. Es el único campo
  editable de la conexión; nunca acepta tokens, estado ni el barbero.
properties:
  reminderMinutes:
    type:
      - integer
      - "null"
    minimum: 0
    maximum: 40320
    description: >
      Minutos entre 0 y 40320 (el límite de Google), o `null` para usar los
      recordatorios predeterminados del calendario del barbero. Fuera de rango
      responde `422` sin guardar nada.
    examples:
      - 30
required:
  - reminderMinutes
