# Representación canónica de un bloqueo puntual (HU-042, RN-BLQ-01/03):
# exactamente id, blockType, source, startsAt, endsAt, reason, deletedAt,
# deletedBy, createdAt, updatedAt. Nunca barbershopId ni barberId: el tenant
# se deriva de SessionCookie y el barbero de la ruta.
type: object
description: >
  Bloqueo puntual de agenda, incluida la emergencia. deletedAt/deletedBy no
  nulos indican retiro lógico (RN-BLQ-04): el registro se conserva pero ya
  no resta disponibilidad.
properties:
  id:
    type: string
    format: uuid
    description: Identificador del bloqueo, opaco para el cliente.
    examples:
      - 6f1a2b3c-4d5e-4f60-8172-8394a5b6c7d8
  blockType:
    type: string
    enum: [break, lunch, unavailable, day_off, holiday, vacation, emergency]
    description: Uno de los siete tipos cerrados (RN-BLQ-01).
    examples:
      - emergency
  source:
    type: string
    enum: [manual, holiday_calendar]
    description: Origen del bloqueo. HU-042 solo produce manual.
    examples:
      - manual
  startsAt:
    type: string
    format: date-time
    description: Instante de inicio, con offset explícito.
    examples:
      - "2026-07-20T15:00:00-05:00"
  endsAt:
    type: string
    format: date-time
    description: Instante de fin (exclusivo), con offset explícito. Siempre posterior a startsAt.
    examples:
      - "2026-07-20T19:00:00-05:00"
  reason:
    type: [string, "null"]
    maxLength: 200
    description: Motivo breve y opcional, visible solo para el barbero.
    examples:
      - "Urgencia médica"
  deletedAt:
    type: [string, "null"]
    format: date-time
    description: Instante del retiro lógico, o null si sigue vigente.
  deletedBy:
    type: [string, "null"]
    format: uuid
    description: Identificador del staff_user que retiró el bloqueo, o null si sigue vigente.
  createdAt:
    type: string
    format: date-time
    description: Instante de alta, con offset.
    examples:
      - "2026-08-26T15:04:05Z"
  updatedAt:
    type: string
    format: date-time
    description: Instante de la última modificación, con offset.
    examples:
      - "2026-08-26T15:04:05Z"
required:
  - id
  - blockType
  - source
  - startsAt
  - endsAt
  - reason
  - deletedAt
  - deletedBy
  - createdAt
  - updatedAt
