# Representación canónica de una cita/turno persistida (HU-060, HU-061).
# La interfaz dice "turno"; el contrato, el código y los datos dicen
# "appointment" (DEC-016).
type: object
properties:
  id:
    type: string
    format: uuid
  barberId:
    type: string
    format: uuid
  serviceId:
    type: string
    format: uuid
  customerId:
    type: string
    format: uuid
  attendeeName:
    type: string
  startsAt:
    type: string
    format: date-time
  endsAt:
    type: string
    format: date-time
  status:
    type: string
    enum: [confirmed, completed, cancelled_by_customer, cancelled_by_barber, no_show]
  origin:
    type: string
    enum: [public, manual]
  serviceName:
    type: string
    description: Nombre del servicio congelado al momento de crear la cita (DEC-004).
  durationMinutes:
    type: integer
  priceAmount:
    type: string
    description: Importe exacto en formato decimal (nunca coma flotante).
    examples:
      - "20000.00"
  currency:
    type: string
    examples:
      - COP
  customerNote:
    type: [string, "null"]
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - id
  - barberId
  - serviceId
  - customerId
  - attendeeName
  - startsAt
  - endsAt
  - status
  - origin
  - serviceName
  - durationMinutes
  - priceAmount
  - currency
  - customerNote
  - createdAt
  - updatedAt
