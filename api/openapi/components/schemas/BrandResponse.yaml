# Representación canónica de la marca y el vocabulario de la barbería
# (issue #292, DEC-110): la misma forma para GET y para la respuesta 200 de
# PATCH. Recurso propio de /private/settings/brand: el contrato de
# BarbershopSettingsResponse (HU-020, CA-020-07) conserva sus cuatro campos.
type: object
additionalProperties: false
description: >
  Marca y vocabulario de la barbería activa: color de acento de una lista
  cerrada, la palabra con la que llama a su negocio y a su profesional (con
  plural y género gramatical, para que la interfaz concuerde). Los términos
  viajan recortados y en minúsculas; la interfaz capitaliza donde corresponde.
  Incluye el panel del usuario que consulta (`panelProfile`), derivado de sus
  roles en la base de datos (`DEC-134`); no es un dato de la barbería. Incluye
  la ubicación física opcional que la reserva pública muestra (`DEC-130`).
properties:
  accent:
    $ref: './BrandAccent.yaml'
  businessTerm:
    $ref: './BrandTerm.yaml'
  businessTermGender:
    $ref: './BrandTermGender.yaml'
  professionalTerm:
    $ref: './BrandTerm.yaml'
  professionalTermPlural:
    $ref: './BrandTerm.yaml'
  professionalTermGender:
    $ref: './BrandTermGender.yaml'
  panelProfile:
    $ref: './PanelProfile.yaml'
  hasPhysicalLocation:
    type: boolean
    description: >
      Interruptor explícito de `DEC-130`: `true` = la barbería tiene un local que
      mostrar en la reserva pública. Apagarlo conserva `address` y las
      coordenadas. Una barbería nueva nace con `true` y sin dirección.
  address:
    type: [string, "null"]
    maxLength: 200
    description: Dirección del local en texto; `null` mientras no se ha capturado.
    examples:
      - Calle 10 # 5-20, Bogotá
  latitude:
    type: [number, "null"]
    minimum: -90
    maximum: 90
    description: >
      Latitud resultante de geocodificar `address` en el servidor al guardarla;
      `null` sin dirección. Solo lectura: el cliente no la envía.
  longitude:
    type: [number, "null"]
    minimum: -180
    maximum: 180
    description: Longitud, igual que `latitude`.
  offersHomeService:
    type: boolean
    description: >
      Interruptor general del servicio a domicilio (`DEC-131`). Con `true`, la
      reserva pública ofrece «a domicilio» para cualquier servicio.
  googlePlaceId:
    type:
      - string
      - "null"
    maxLength: 200
    pattern: '^[A-Za-z0-9_-]+$'
    description: >
      Place ID de la ficha de Google de la barbería (`DEC-129`); `null` sin ficha.
      Con él la reserva pública muestra la calificación y las reseñas de Google.
    examples:
      - ChIJN1t_tDeuEmsRUsoyG83frY4
required:
  - accent
  - businessTerm
  - businessTermGender
  - professionalTerm
  - professionalTermPlural
  - professionalTermGender
  - panelProfile
  - hasPhysicalLocation
  - address
  - latitude
  - longitude
  - offersHomeService
  - googlePlaceId
