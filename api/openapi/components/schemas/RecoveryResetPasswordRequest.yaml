# Cuerpo de POST /auth/recovery/reset-password (HU-008, DEC-063/DEC-064/
# DEC-092). Cerrado. resetToken es el valor devuelto por la verificación
# exitosa; newPassword se valida contra la política de DEC-063 (10-128
# caracteres, distinta del correo y de la contraseña actual) en el servicio,
# no aquí: ese mensaje debe indicar exactamente qué regla incumple
# (CA-008-08), algo que un patrón de esquema no puede expresar con precisión
# suficiente.
# Destino elegido en la recuperación de acceso (DEC-092, DEC-093). Se repite
# en los tres pasos con el mismo canal y valor (DP-SEG-15): channel=email
# exige email; channel=whatsapp exige phone; el campo del otro canal no se
# admite. El valor solo identifica la cuenta: el código se entrega al
# contacto verificado almacenado, nunca a un destino escrito aquí.
type: object
additionalProperties: false
description: Establece la contraseña nueva usando el token de reinicio emitido por la verificación.
properties:
  channel:
    type: string
    enum: [email, whatsapp]
    description: Canal por el que la persona quiere recibir el código de recuperación.
    examples:
      - email
  email:
    type: string
    format: email
    maxLength: 254
    description: Correo de la cuenta. Obligatorio cuando channel es email; no se admite con whatsapp.
    examples:
      - barbero.ejemplo@correo.test
  phone:
    type: string
    maxLength: 32
    description: >-
      Número de WhatsApp de la cuenta en formato internacional (E.164,
      `+573001234567`); se descartan espacios, guiones, puntos y paréntesis.
      Obligatorio cuando channel es whatsapp; no se admite con email.
    examples:
      - "+573001234567"
  resetToken:
    type: string
    writeOnly: true
    minLength: 20
    maxLength: 64
    description: Token de reinicio de un solo uso devuelto por la verificación exitosa.
    examples:
      - 3n9F7qP2xR8mK1vL0dS5tY6wZ4bH2jN9
  newPassword:
    type: string
    writeOnly: true
    minLength: 10
    maxLength: 128
    description: Contraseña nueva; se rechaza si no cumple la política mínima documentada (DEC-063).
    examples:
      - "***-nueva-contrasena-ficticia"
required:
  - channel
  - resetToken
  - newPassword
oneOf:
  - properties:
      channel:
        const: email
    required:
      - email
    not:
      properties:
        phone: {}
      required:
        - phone
  - properties:
      channel:
        const: whatsapp
    required:
      - phone
    not:
      properties:
        email: {}
      required:
        - email
