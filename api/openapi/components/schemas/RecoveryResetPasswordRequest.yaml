# Cuerpo de POST /auth/recovery/reset-password (HU-008, DEC-063/DEC-064).
# Cerrado. resetToken es el valor devuelto por la verificación exitosa;
# newPassword se valida contra la política de DEC-063 (10-128 caracteres,
# distinta del correo y de la contraseña actual) en el servicio, no aquí:
# ese mensaje debe indicar exactamente qué regla incumple (CA-008-08), algo
# que un patrón de esquema no puede expresar con precisión suficiente.
type: object
additionalProperties: false
description: Establece la contraseña nueva usando el token de reinicio emitido por la verificación.
properties:
  email:
    type: string
    format: email
    maxLength: 254
    description: Correo de la cuenta que solicitó la recuperación.
    examples:
      - barbero.ejemplo@correo.test
  resetToken:
    type: string
    writeOnly: true
    minLength: 20
    maxLength: 64
    description: Token de reinicio de un solo uso devuelto por la verificación exitosa.
    examples:
      - 3n9F7qP2xR8mK1vL0dS5tY6wZ4bH2jN9
  newPassword:
    type: string
    writeOnly: true
    minLength: 10
    maxLength: 128
    description: Contraseña nueva; se rechaza si no cumple la política mínima documentada (DEC-063).
    examples:
      - "***-nueva-contrasena-ficticia"
required:
  - email
  - resetToken
  - newPassword
