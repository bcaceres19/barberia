# Cuerpo de POST /customer/appointments/{token}/review (HU-100, DEC-128).
type: object
description: >
  Reseña del cliente sobre el barbero que lo atendió. Cerrado: cualquier otro
  campo se rechaza. Nunca lleva datos del cliente: el turno sale del `token`.
additionalProperties: false
properties:
  rating:
    type: integer
    minimum: 1
    maximum: 5
    description: Calificación obligatoria de 1 a 5.
    examples:
      - 5
  comment:
    type:
      - string
      - "null"
    maxLength: 500
    description: >
      Comentario opcional de hasta 500 caracteres. Se recortan los espacios de los
      extremos; vacío o solo espacios se guarda como `null`. No debe incluir
      teléfonos, direcciones ni nombres de terceros (`RN-DAT-02`).
    examples:
      - Muy buen corte y puntual.
      - null
required:
  - rating
