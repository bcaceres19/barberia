# Reseñas de un barbero para moderar (HU-100, CA-100-05).
type: object
description: >
  Resumen público y todas las reseñas del barbero, ocultas incluidas (hasta 100),
  de la más reciente a la más antigua.
properties:
  rating:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
    description: Promedio de 1 decimal de las reseñas no ocultas, o `null` sin ninguna.
    examples:
      - 4.5
  ratingCount:
    type: integer
    minimum: 0
    description: Total de reseñas no ocultas.
    examples:
      - 2
  items:
    type: array
    maxItems: 100
    items:
      $ref: './Review.yaml'
required:
  - rating
  - ratingCount
  - items
