# Respuesta 200 de POST /customer/appointments/{token}/cancel (HU-099).
# Deliberadamente mínima: el cliente ya tiene los datos del turno y el enlace
# sigue vigente (DEC-136), así que consulta el detalle con GET.
type: object
additionalProperties: false
description: Resultado de la cancelación del cliente.
properties:
  status:
    type: string
    enum: [cancelled_by_customer]
    description: Estado terminal en el que quedó el turno.
required:
  - status
