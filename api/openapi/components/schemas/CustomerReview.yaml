# La reseña que el cliente dejó sobre su turno (HU-100, DEC-128).
type: object
description: >
  Reseña propia del turno que el cliente ve en el acceso a su cita. Solo
  calificación, comentario y fecha: nunca un identificador interno.
properties:
  rating:
    type: integer
    minimum: 1
    maximum: 5
    examples:
      - 5
  comment:
    type:
      - string
      - "null"
    maxLength: 500
    examples:
      - Muy buen corte y puntual.
      - null
  createdAt:
    type: string
    format: date-time
    examples:
      - "2027-03-15T16:10:00Z"
required:
  - rating
  - comment
  - createdAt
