# Previsualización del impacto de desactivar un servicio (HU-024,
# CA-024-01, DEC-069). affectedAppointments es el recuento real de citas
# `confirmed` futuras del servicio en la barbería de la sesión; era 0 fijo
# solo mientras `appointment` no existía (B1).
type: object
description: >
  Impacto real, calculado en el momento de la solicitud, de desactivar el
  servicio ahora mismo.
properties:
  affectedAppointments:
    type: integer
    minimum: 0
    description: >
      Cantidad de citas `confirmed` con inicio futuro que quedarían afectadas
      si el servicio se desactiva (RN-SER-03). Ninguna se cancela ni se
      modifica al desactivar.
    examples:
      - 0
required:
  - affectedAppointments
