# Representación canónica de un servicio del catálogo (HU-022, CA-022-01,
# CA-022-07; HU-024, CA-024-02, CA-024-05): id, name, description,
# durationMinutes, price, currency, isActive, deactivatedAt, createdAt,
# updatedAt. isActive/deactivatedAt reflejan el ciclo de vida de HU-024
# (RN-SER-03): nunca asignaciones a barberos ni citas (alcance excluido de
# HU-022/HU-024). barbershopId NUNCA aparece, mismo criterio que
# BarberResponse: el tenant se deriva exclusivamente de SessionCookie.
type: object
description: >
  Servicio del catálogo de la barbería activa. currency es siempre "COP"
  (DEC-067): fija para todo el MVP, nunca aceptada como entrada del cliente.
  isActive/deactivatedAt son de solo lectura: ningún endpoint de HU-022
  (create/update) los acepta como entrada; solo cambian mediante
  POST .../deactivate y POST .../reactivate (HU-024).
properties:
  id:
    type: string
    format: uuid
    description: Identificador del servicio, opaco para el cliente.
    examples:
      - 8f3ac2b1-e4d5-46f6-a7c8-d9e0f1a2b3c4
  name:
    type: string
    minLength: 1
    maxLength: 120
    description: Nombre visible del servicio, ya recortado por el servidor.
    examples:
      - Corte clásico
  description:
    type: [string, "null"]
    maxLength: 500
    description: Descripción opcional del servicio. `null` cuando no tiene.
    examples:
      - Corte con máquina y tijera, incluye lavado.
  durationMinutes:
    type: integer
    minimum: 1
    maximum: 1440
    description: >
      Duración planificada en minutos enteros (RN-SER-01, RN-SER-02): sin
      lista cerrada de valores, 25 o 45 minutos son igual de válidos que 30,
      60 o 90.
    examples:
      - 30
  price:
    type: string
    pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
    description: >
      Precio informativo, decimal exacto con hasta dos cifras, estrictamente
      mayor que cero (DEC-067: sin servicios gratuitos). Nunca coma
      flotante: comparar como texto o convertir con una biblioteca decimal,
      nunca con `parseFloat`.
    examples:
      - "45000.00"
  currency:
    type: string
    enum: [COP]
    description: >
      Moneda fija en COP para todo el MVP (DEC-067). Informativo: ningún
      endpoint de HU-022 acepta este campo como entrada.
    examples:
      - COP
  isActive:
    type: boolean
    description: >
      Estado de ciclo de vida (HU-024, RN-SER-03): `true` mientras el
      servicio se ofrece; `false` cuando se desactivó. Nunca se borra
      físicamente; desactivar/reactivar son las únicas transiciones.
    examples:
      - true
  deactivatedAt:
    type: [string, "null"]
    format: date-time
    description: >
      Instante en que el servicio pasó a inactivo, con offset. `null`
      mientras `isActive` es `true`; nunca `null` cuando es `false`
      (invariante `service_deactivated_at_ck`).
    examples:
      - null
  createdAt:
    type: string
    format: date-time
    description: Instante de alta, con offset.
    examples:
      - "2026-08-24T15:04:05Z"
  updatedAt:
    type: string
    format: date-time
    description: Instante de la última modificación (alta o edición), con offset.
    examples:
      - "2026-08-24T15:04:05Z"
required:
  - id
  - name
  - description
  - durationMinutes
  - price
  - currency
  - isActive
  - deactivatedAt
  - createdAt
  - updatedAt
