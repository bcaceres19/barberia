    IdempotencyLockedProblem:
      $ref: './components/responses/IdempotencyLockedProblem.yaml'
    LoginSuccess:
      $ref: './components/responses/LoginSuccess.yaml'
    SessionContextSuccess:
      $ref: './components/responses/SessionContextSuccess.yaml'
    ChallengeAccepted:
      $ref: './components/responses/ChallengeAccepted.yaml'
    ChallengeVerifySuccess:
      $ref: './components/responses/ChallengeVerifySuccess.yaml'
    ChallengeRequiredProblem:
