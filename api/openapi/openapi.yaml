  securitySchemes:
    SessionCookie:
      $ref: './components/security-schemes/SessionCookie.yaml'
  headers:
    X-Request-Id:
      $ref: './components/headers/XRequestId.yaml'
    Set-Cookie:
      $ref: './components/headers/SetCookieSession.yaml'
    ClearCookieSession:
      $ref: './components/headers/ClearCookieSession.yaml'
    Retry-After:
