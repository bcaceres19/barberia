# Documento de entrada del contrato HTTP. Fuente de verdad según
# docs/06-api/estandar-openapi.md (DEC-037). No se edita el bundle generado
# en dist/; este archivo y los que referencia son la fuente.
#
# HU-005 agregó la primera operación de negocio: POST /public/auth/login.
# HU-006 agrega la primera operación privada real: POST
# /private/auth/logout, que registra por primera vez
# components/securitySchemes/SessionCookie (DEC-058). HU-012 agrega la
# segunda operación privada, de solo lectura: GET /private/auth/session
# (DEC-060), que rehidrata la cookie HttpOnly al abrir o recargar la
# aplicación. Los componentes de error ya eran reales desde HU-003
# (recuperación de panic, aislamiento por tenant, límite de cuerpo); paths
# queda vacío para el resto de capacidades hasta su primer endpoint
# implementado.
openapi: 3.1.2
info:
  title: API del sistema de agenda para barberías
  version: 0.5.0
  description: >
    Contrato HTTP entre apps/web y apps/api. Tres audiencias comparten este
    documento: /api/v1/public (reserva sin sesión), /api/v1/customer
    (acceso por token del enlace de la cita) y /api/v1/private (sesión del
    barbero), según docs/04-arquitectura/backend-go.md sección 7.
  license:
    name: Propietaria, uso interno del proyecto
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Identidad, sesiones y recuperación de acceso del barbero.
paths:
  /public/auth/login:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1login'
  /public/auth/challenge:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1challenge'
  /public/auth/challenge/verify:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1challenge~1verify'
  /public/auth/recovery/request:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1recovery~1request'
  /public/auth/recovery/verify:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1recovery~1verify'
  /public/auth/recovery/reset-password:
    $ref: './paths/public-auth.yaml#/~1public~1auth~1recovery~1reset-password'
  /private/auth/logout:
    $ref: './paths/private-auth.yaml#/~1private~1auth~1logout'
  /private/auth/session:
    $ref: './paths/private-auth.yaml#/~1private~1auth~1session'
components:
  schemas:
    Problem:
      $ref: './components/schemas/Problem.yaml'
    LoginRequest:
      $ref: './components/schemas/LoginRequest.yaml'
    LoginResponse:
      $ref: './components/schemas/LoginResponse.yaml'
    SessionContextResponse:
      $ref: './components/schemas/SessionContextResponse.yaml'
    ChallengeRequest:
      $ref: './components/schemas/ChallengeRequest.yaml'
    ChallengeVerifyRequest:
      $ref: './components/schemas/ChallengeVerifyRequest.yaml'
    ChallengeAcceptedResponse:
      $ref: './components/schemas/ChallengeAcceptedResponse.yaml'
  securitySchemes:
    SessionCookie:
      $ref: './components/security-schemes/SessionCookie.yaml'
  headers:
    X-Request-Id:
      $ref: './components/headers/XRequestId.yaml'
    Set-Cookie:
      $ref: './components/headers/SetCookieSession.yaml'
    ClearCookieSession:
      $ref: './components/headers/ClearCookieSession.yaml'
    Retry-After:
      $ref: './components/headers/RetryAfter.yaml'
  parameters:
    IdempotencyKey:
      $ref: './components/parameters/IdempotencyKey.yaml'
  responses:
    LogoutSuccess:
      $ref: './components/responses/LogoutSuccess.yaml'
    NotFoundProblem:
      $ref: './components/responses/NotFoundProblem.yaml'
    InternalErrorProblem:
      $ref: './components/responses/InternalErrorProblem.yaml'
    PayloadTooLargeProblem:
      $ref: './components/responses/PayloadTooLargeProblem.yaml'
    InvalidRequestProblem:
      $ref: './components/responses/InvalidRequestProblem.yaml'
    ValidationProblem:
      $ref: './components/responses/ValidationProblem.yaml'
    UnauthorizedProblem:
      $ref: './components/responses/UnauthorizedProblem.yaml'
    IdempotencyConflictProblem:
      $ref: './components/responses/IdempotencyConflictProblem.yaml'
    IdempotencyLockedProblem:
      $ref: './components/responses/IdempotencyLockedProblem.yaml'
    LoginSuccess:
      $ref: './components/responses/LoginSuccess.yaml'
    SessionContextSuccess:
      $ref: './components/responses/SessionContextSuccess.yaml'
    ChallengeAccepted:
      $ref: './components/responses/ChallengeAccepted.yaml'
    ChallengeVerifySuccess:
      $ref: './components/responses/ChallengeVerifySuccess.yaml'
    ChallengeRequiredProblem:
      $ref: './components/responses/ChallengeRequiredProblem.yaml'
