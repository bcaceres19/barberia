# Documento de entrada del contrato HTTP. Fuente de verdad según
# docs/06-api/estandar-openapi.md (DEC-037). No se edita el bundle generado
# en dist/; este archivo y los que referencia son la fuente.
#
# Sin operaciones todavía: HU-003 solo entrega la base HTTP (Chi v5, tres
# audiencias, errores uniformes) sin endpoints de negocio. Los componentes
# de error de esta sección ya son reales porque el servidor los emite desde
# hoy (recuperación de panic, aislamiento por tenant, límite de cuerpo);
# paths queda vacío hasta el primer endpoint implementado.
openapi: 3.1.2
info:
  title: API del sistema de agenda para barberías
  version: 0.1.0
  description: >
    Contrato HTTP entre apps/web y apps/api. Tres audiencias comparten este
    documento: /api/v1/public (reserva sin sesión), /api/v1/customer
    (acceso por token del enlace de la cita) y /api/v1/private (sesión del
    barbero), según docs/04-arquitectura/backend-go.md sección 7.
  license:
    name: Propietaria, uso interno del proyecto
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags: []
paths: {}
components:
  schemas:
    Problem:
      $ref: './components/schemas/Problem.yaml'
  headers:
    X-Request-Id:
      $ref: './components/headers/XRequestId.yaml'
  responses:
    NotFoundProblem:
      $ref: './components/responses/NotFoundProblem.yaml'
    InternalErrorProblem:
      $ref: './components/responses/InternalErrorProblem.yaml'
    PayloadTooLargeProblem:
      $ref: './components/responses/PayloadTooLargeProblem.yaml'
