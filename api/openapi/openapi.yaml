    ChallengeRequest:
      $ref: './components/schemas/ChallengeRequest.yaml'
    ChallengeVerifyRequest:
      $ref: './components/schemas/ChallengeVerifyRequest.yaml'
    ChallengeAcceptedResponse:
      $ref: './components/schemas/ChallengeAcceptedResponse.yaml'
    BarbershopSettingsResponse:
      $ref: './components/schemas/BarbershopSettingsResponse.yaml'
    UpdateBarbershopSettingsRequest:
      $ref: './components/schemas/UpdateBarbershopSettingsRequest.yaml'
    BarberResponse:
      $ref: './components/schemas/BarberResponse.yaml'
    BarberListResponse:
      $ref: './components/schemas/BarberListResponse.yaml'
    CreateBarberRequest:
      $ref: './components/schemas/CreateBarberRequest.yaml'
    UpdateBarberRequest:
      $ref: './components/schemas/UpdateBarberRequest.yaml'
    ServiceResponse:
      $ref: './components/schemas/ServiceResponse.yaml'
    ServiceListResponse:
      $ref: './components/schemas/ServiceListResponse.yaml'
    CreateServiceRequest:
      $ref: './components/schemas/CreateServiceRequest.yaml'
    UpdateServiceRequest:
