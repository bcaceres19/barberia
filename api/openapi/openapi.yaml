# Documento de entrada del contrato HTTP. Fuente de verdad según
# docs/06-api/estandar-openapi.md (DEC-037). No se edita el bundle generado
# en dist/; este archivo y los que referencia son la fuente.
#
# HU-094 agrega la cuarta operación pública de reserva: GET
# /public/barbershops/{slug}/services/{serviceId}/barbers/{barberId}/
# availability (paths/public-booking.yaml), disponibilidad pública real sin
# sesión (CA-094-01 a CA-094-06). Resuelve DP-PUB-03 como DEC-084.
#
# HU-093 agrega la política pública de reserva y cancelación al tag
# Settings: GET/PUT /private/settings/booking-policy (paths/settings.yaml),
# anticipación, ventana, rejilla, plazo y cancelación tardía, protegida por
# la precondición de versión If-Match (CA-093-01 a CA-093-04). Resuelve
# DP-PUB-02 como DEC-083.
#
# HU-092 agrega la tercera operación pública de reserva: GET
# /public/barbershops/{slug}/services/{serviceId}/barbers
# (paths/public-booking.yaml), barberos con asignación vigente al servicio
# activo resuelto, sin sesión (CA-092-01 a CA-092-03).
#
# HU-091 agrega la segunda operación pública de reserva: GET
# /public/barbershops/{slug}/services (paths/public-booking.yaml),
# catálogo público de servicios activos y con al menos una asignación
# vigente, resuelto por el mismo slug sin sesión (CA-091-01).
#
# HU-090 agrega el tag PublicBooking y la primera operación pública de
# reserva: GET /public/barbershops/{slug} (paths/public-booking.yaml),
# resolución sin sesión mediante public_resolve_barbershop_by_slug
# (20260911045044_add_barbershop_public_slug.sql, DEC-082, resuelve
# DP-PUB-01).
#
# HU-042 agrega paths/time-blocks.yaml al tag Schedule: bloqueo puntual
# (incluida la emergencia, RN-BLQ-03), definición recurrente weekly/date_list
# con sus sub-recursos de fechas explícitas y excepciones ("esta instancia
# no"), y la proyección efectiva de solo lectura (GET .../time-blocks/
# effective). Los altas de bloqueo/serie llevan Idempotency-Key (RN-IDE-01);
# los sub-recursos de fechas/excepciones no, porque un duplicado ya responde
# de forma determinista con 409 sin efecto duplicado. Crear un bloqueo o una
# serie NUNCA cancela, reprograma ni consulta citas (RN-BLQ-03): la lista de
# citas afectadas queda para B3/B5.
#
# HU-041 agrega paths/schedule-exceptions.yaml al tag Schedule: el
# interruptor holiday-calendar por barbero, el CRUD de schedule-exceptions
# (cabecera de fecha + tramos, con Idempotency-Key en el alta, RN-IDE-01),
# y colombian-holidays (referencia calendárica calculada, Ley 51 de 1983
# "Ley Emiliani", sin tabla ni dependencia nueva).
#
# HU-040 agrega el tag Schedule y las cuatro operaciones de
# paths/schedules.yaml: listar, crear (con Idempotency-Key, RN-IDE-01, y
# conflicto de solape/hora repetida del mismo barbero y día), consultar y
# editar tramos recurrentes de working_hour de un barbero. CT-008 se
# resolvió como DEC-070 (FK en ON DELETE RESTRICT, no CASCADE).
#
# HU-024 agrega paths/service-lifecycle.yaml: previsualizar el impacto
# (siempre 0 en B1, DEC-069), desactivar y reactivar un servicio del
# catálogo, protegidas con Idempotency-Key (RN-IDE-01). ServiceResponse
# gana isActive/deactivatedAt, de solo lectura.
#
# HU-005 agregó la primera operación de negocio: POST /public/auth/login.
# HU-006 agrega la primera operación privada real: POST
# /private/auth/logout, que registra por primera vez
# components/securitySchemes/SessionCookie (DEC-058). HU-012 agrega la
# segunda operación privada, de solo lectura: GET /private/auth/session
# (DEC-060), que rehidrata la cookie HttpOnly al abrir o recargar la
# aplicación. HU-021 agrega el tag Staff y las cuatro operaciones de
# paths/staff.yaml: listar, registrar (con Idempotency-Key, RN-IDE-01),
# consultar y renombrar barberos. HU-022 agrega el tag Catalog y las cuatro
# operaciones de paths/catalog.yaml: listar, crear (con Idempotency-Key,
# RN-IDE-01, y conflicto de nombre entre servicios activos, DEC-067),
# consultar y editar servicios del catálogo básico. Los componentes de
# error ya eran reales desde HU-003 (recuperación de panic, aislamiento por
# tenant, límite de cuerpo); paths queda vacío para el resto de capacidades
# hasta su primer endpoint implementado.
openapi: 3.1.2
info:
  title: API del sistema de agenda para barberías
  version: 0.20.0
  description: >
    Contrato HTTP entre apps/web y apps/api. Tres audiencias comparten este
    documento: /api/v1/public (reserva sin sesión), /api/v1/customer
    (acceso por token del enlace de la cita) y /api/v1/private (sesión del
    barbero), según docs/04-arquitectura/backend-go.md sección 7.
  license:
    name: Propietaria, uso interno del proyecto
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Identidad, sesiones y recuperación de acceso del barbero.
  - name: Settings
    description: Configuración general de la barbería.
  - name: Staff
    description: Registro y listado de los barberos de la barbería.
  - name: Catalog
    description: >-
      Catálogo básico de servicios de la barbería (HU-022), su asignación a
      barberos (HU-023) y su ciclo de desactivación/reactivación (HU-024).
  - name: Schedule
    description: >-
      Horario laboral recurrente de cada barbero (HU-040), calendario
      colombiano de festivos y excepciones de jornada por fecha (HU-041), y
      bloqueos de agenda puntuales y recurrentes (HU-042).
  - name: Booking
    description: >-
      Registro de turnos: creación manual por el barbero (HU-061), con
      historial e idempotencia reutilizada de HU-004/HU-060.
  - name: PublicBooking
    description: >-
      Flujo público de reserva sin sesión del barbero: entrada por el
      enlace de una barbería (HU-090), catálogo público de servicios
      (HU-091), selección pública de barbero (HU-092) y disponibilidad
      pública real (HU-094). El resto del flujo (exploración de fechas en el
      frontend, creación de turnos, acceso/cancelación del cliente) llega
      bloqueado por decisiones abiertas (docs/00-control/dudas-pendientes.md).
