<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NAVA</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0c0f;
    --fg: #f4f4f5;
    --muted: #9a9aa2;
    --accent: #7c8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
    text-align: center;
  }
  .mark {
    width: 3rem;
    height: 3rem;
    margin: 0 auto 1.5rem;
    border-radius: 0.75rem;
    background: linear-gradient(135deg, var(--accent), #4d5bd9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.25rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>NAVA</h1>
    <p>Software de gestión para barberías: turnos, agenda y operación diaria en un solo lugar.</p>
    <footer>En desarrollo &middot; nava.app</footer>
  </main>
</body>
</html>
