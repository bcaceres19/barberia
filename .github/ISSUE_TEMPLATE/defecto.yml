name: Defecto
description: Reportar un comportamiento incorrecto y reproducible sin incluir datos sensibles.
title: ""
body:
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Describa lo observado y su impacto. No incluya datos personales, tokens ni secretos.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Indique la regla o resultado que debería cumplirse.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Con datos ficticios...
        2. Ejecutar...
        3. Observar...
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options:
        - Crítico — seguridad, corrupción/pérdida de datos o sistema indisponible
        - Alto — bloquea un recorrido P0 sin alternativa segura
        - Medio — degrada el recorrido, existe alternativa
        - Bajo — defecto menor sin pérdida funcional
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno y versión
      description: Ambiente, SHA o versión, navegador/dispositivo y momento aproximado si aportan contexto.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia sanitizada
      description: Adjunte logs, request_id o capturas sin datos reales ni credenciales.
  - type: textarea
    id: regresion
    attributes:
      label: Prueba de regresión propuesta
      description: Señale la capa más baja que reproduce fielmente el defecto.
    validations:
      required: true
