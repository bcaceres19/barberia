name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite disparar el pipeline manualmente desde cualquier rama, útil para
  # verificar el workflow en la infraestructura real de GitHub antes de que
  # exista en la rama base (pull_request usa el workflow de la base, no el
  # de la rama de la PR).
  workflow_dispatch: {}

env:
  ATLAS_VERSION: v1.3.0

jobs:
  go:
    name: Go (build, vet, test -race, govulncheck)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Instalar cliente psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: gofmt
        working-directory: apps/api
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Archivos sin formatear (gofmt -w antes de subir):"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        working-directory: apps/api
        run: go vet ./...

      - name: go build
        working-directory: apps/api
        run: go build ./...

      - name: Aplicar las 6 migraciones (esquema de prueba)
        working-directory: database/migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in 20260807170000_create_tenant_foundation.sql \
                   20260807170100_create_idempotency_record.sql \
                   20260811145252_harden_roles_and_definer_functions.sql \
                   20260811154100_harden_idempotency_concurrency.sql \
                   20260811220000_harden_idempotency_fingerprint_format.sql \
                   20260813120000_create_auth_credentials_and_sessions.sql \
                   20260817180000_create_login_throttle_and_phone_challenge.sql \
                   20260817190000_create_staff_recovery_code.sql \
                   20260823120000_add_barbershop_contact_info.sql \
                   20260823130000_create_barber.sql \
                   20260824140000_create_service.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE barberia_app PASSWORD 'app_test';"
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE barberia_worker PASSWORD 'worker_test';"

      - name: Cargar testdata de dos barberías
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/dos_barberias.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu005_credenciales_sesiones.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu007_reto_telefonico.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu021_barberos.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu022_catalogo.sql

      - name: go test -race
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://barberia_app:app_test@localhost:5432/postgres?sslmode=disable
          TEST_WORKER_DATABASE_URL: postgres://barberia_worker:worker_test@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

      - name: govulncheck
        working-directory: apps/api
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  openapi:
    name: OpenAPI (lint + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: pnpm install (lockfile inmutable)
        run: pnpm install --frozen-lockfile

      - name: openapi:check-config
        run: pnpm run openapi:check-config

      - name: openapi:lint
        run: pnpm run openapi:lint

      - name: openapi:bundle
        run: pnpm run openapi:bundle

  web:
    name: Frontend (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: pnpm install (lockfile inmutable)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: format
        working-directory: apps/web
        run: pnpm run format

      - name: lint
        working-directory: apps/web
        run: pnpm run lint

      - name: typecheck
        working-directory: apps/web
        run: pnpm run typecheck

      - name: test:unit
        working-directory: apps/web
        run: pnpm run test:unit

      - name: build
        working-directory: apps/web
        run: pnpm run build

  database:
    name: Atlas + suites SQL contra el esquema aplicado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar cliente psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Instalar Atlas CLI (versión fijada, docs/05-backend/migraciones-atlas.md §3.3)
        run: |
          curl -sSfL "https://release.ariga.io/atlas/atlas-linux-amd64-${ATLAS_VERSION}" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas version

      - name: atlas migrate validate
        working-directory: database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: atlas migrate validate --env local

      - name: atlas migrate apply (desde base vacía)
        working-directory: database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: atlas migrate apply --env local

      - name: atlas migrate apply (segunda vez, sin cambios esperados)
        working-directory: database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          salida=$(atlas migrate apply --env local)
          echo "$salida"
          echo "$salida" | grep -q "No migration files to execute"

      - name: Fijar contraseñas de barberia_app y barberia_worker
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE barberia_app PASSWORD 'app_test';"
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE barberia_worker PASSWORD 'worker_test';"

      - name: Cargar testdata de dos barberías
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/dos_barberias.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu005_credenciales_sesiones.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu007_reto_telefonico.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu021_barberos.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/testdata/hu022_catalogo.sql

      - name: Suite de aislamiento HU-001
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu001_aislamiento_rls.sql

      - name: Suite de credenciales y sesiones HU-005
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu005_aislamiento_credenciales_sesiones.sql

      - name: Suite de defensa contra abuso HU-007
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu007_defensa_abuso.sql

      - name: Suite de recuperación de acceso HU-008
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu008_recuperacion_acceso.sql

      - name: Suite de configuración de la barbería HU-020
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu020_configuracion_barberia.sql

      - name: Suite de registro y listado de barberos HU-021
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu021_barberos.sql

      - name: Suite de catálogo básico de servicios HU-022
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/hu022_catalogo.sql

      - name: Suite de idempotencia (secuencial, una conexión)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/idempotency_concurrency.sql

      - name: Suite de idempotencia (dos conexiones reales)
        env:
          DATABASE_TEST_URL: postgres://barberia_app:app_test@localhost:5432/postgres?sslmode=disable
        run: bash database/tests/idempotency_concurrency_two_connections.sh
